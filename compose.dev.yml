name: s15p11b102-dev

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: i15b102-frontend:dev
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3102}:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - package.json
            - package-lock.json
            - Dockerfile*
            - nginx.conf
            - .env
            - .env.*
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: i15b102-backend:dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-backend}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backend}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-backend-local-password}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8102}:8080"
    volumes:
      - gradle-cache:/root/.gradle
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /workspace/src
          initial_sync: true
        - action: rebuild
          path: ./backend/build.gradle
        - action: rebuild
          path: ./backend/settings.gradle
        - action: rebuild
          path: ./backend/gradle

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-dev-data:
  gradle-cache:
