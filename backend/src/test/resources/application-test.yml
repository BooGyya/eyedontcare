# application-test.yml (전체 교체)
jwt:
  secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600

kakao:
  client-id: test-kakao-client-id
  client-secret: test-kakao-client-secret
  redirect-uri: http://localhost:5173/auth/kakao/callback
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  connect-timeout: 3s
  read-timeout: 5s

app:
  cors:
    allowed-origins: http://localhost:5173
  waiting-room:
    websocket:
      auth-timeout: PT0.2S
      send-time-limit: PT5S
      buffer-size-limit: 65536

spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/backend
    username: backend
    password: backend-local-password
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  sql:
    init:
      mode: always
