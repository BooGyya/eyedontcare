app:
  cors:
    allowed-origins: http://localhost:5173

jwt:
  secret-key: ${JWT_SECRET_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
  client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/kakao/callback}

openvidu:
  # WebRTC 미디어 서버(OpenVidu 3.x = LiveKit). url은 브라우저가 접속할 WSS 주소.
  # api-key/api-secret은 미디어 접속 토큰 서명 키로, 실제 값은 .env(미추적)로 주입한다.
  # 기본값은 OpenVidu local-deployment 기본 키라 EC2 검증은 통과하지 못한다(로컬 개발용 placeholder).
  url: ${OPENVIDU_URL:wss://localhost:7443}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${SPRING_DATASOURCE_USERNAME:backend}
    password: ${SPRING_DATASOURCE_PASSWORD:backend-local-password}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
