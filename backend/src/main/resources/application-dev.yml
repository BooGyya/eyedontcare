app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET_KEY}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${SPRING_DATASOURCE_USERNAME:backend}
    password: ${SPRING_DATASOURCE_PASSWORD:backend-local-password}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always

