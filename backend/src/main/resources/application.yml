app:
  guest:
    session-ttl: PT24H
  matchmaking:
    # 매칭 대기 자체에는 시간 제한이 없다. 이 값은 연결이 끊긴 참가자를 청소하는 안전망이다.
    # WebSocket(/ws/match)이 붙어 연결 종료를 감지하게 되면 재검토한다.
    entry-ttl: PT30M
  waiting-room:
    active-ttl: PT10M
    closed-ttl: PT30S
    max-participants: 2
    invite-code-max-attempts: 20

spring:
  application:
    name: backend
  profiles:
    default: dev
  mvc:
    problemdetails:
      enabled: false
  web:
    error:
      include-exception: false
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-path: always

server:
  port: ${SERVER_PORT:8080}

jwt:
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

kakao:
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  connect-timeout: 3s
  read-timeout: 5s
