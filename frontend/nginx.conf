server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 프록시. 컨테이너 단독/로컬 prod 스택에서도 백엔드로 전달되도록 둔다.
    # 실 프로덕션에서는 호스트 nginx가 /api 를 backend 로 먼저 라우팅하므로 이 블록엔 도달하지 않는다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 눈으로 그림 그리기 AI 채점(/games/draw/recognize)은 gpt-4o Vision 호출이라 수십 초가
        # 걸릴 수 있다. nginx 기본 읽기 타임아웃(60초)을 넘기면 프록시가 먼저 끊어 502가 되므로
        # 백엔드 read-timeout(60초)보다 넉넉히 잡는다.
        # ⚠️ 실 프로덕션은 이 컨테이너 앞단에 호스트 nginx가 한 번 더 있으므로(위 /api 주석 참고),
        #    그 호스트 nginx에도 동일한 proxy_read_timeout을 설정해야 한다.
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket 프록시 (매칭 /ws/match, 대기방 /ws/waiting-rooms/{roomId}).
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        # MediaPipe tasks-vision의 스레드 WASM(SharedArrayBuffer)은 cross-origin isolation이 있어야
        # 로드된다. 이 두 헤더가 없으면 눈 깜빡이기 등 useEyeTracking()을 쓰는 화면에서 카메라 시작이
        # 조용히 실패한다. ⚠️ 실 프로덕션에서 이 컨테이너 앞단에 호스트 nginx가 한 번 더 있다면(위
        # /api 주석 참고), 그 호스트 nginx도 이 헤더를 지우지 않고 그대로 전달하는지 확인할 것.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ /index.html;
    }
}
